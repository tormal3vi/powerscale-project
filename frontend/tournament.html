<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscale — Tournament</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div id="topbar"></div>
  <div class="t-page">

    <div id="setup">
      <div class="t-setup-head">
        <div class="t-title">New tournament</div>
        <div class="t-size">
          <span>Size</span>
          <div class="t-seg" role="group" aria-label="Tournament size">
            <button data-size="8" class="active">8</button>
            <button data-size="16">16</button>
          </div>
        </div>
      </div>
      <div class="t-setup-grid">
        <div class="t-card">
          <label class="t-search">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#7A7264" stroke-width="1.4"/><path d="m11 11 3.5 3.5" stroke="#7A7264" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="visually-hidden">Search characters</span>
            <input id="t-search" type="text" placeholder="Search characters to add…" autocomplete="off">
          </label>
          <div id="t-results" class="t-results"></div>
        </div>
        <div class="t-card t-entrants">
          <div class="t-entrants-head">
            <div id="t-picked-label">Entrants (0/8)</div>
            <button class="t-text-btn" id="clear-all">Clear</button>
          </div>
          <div id="t-picked" class="t-picked"></div>
          <button class="pill-button t-full" id="fill-random">Fill randomly</button>
          <button class="btn-gold t-full t-run" id="run-tournament" disabled>Run tournament →</button>
        </div>
      </div>
    </div>

    <div id="bracket-wrap" style="display:none;">
      <div class="t-champion">
        <div class="t-champ-left">
          <div class="t-champ-avatar" id="t-champ-avatar"></div>
          <div>
            <div class="t-champ-label" id="t-champ-label">Champion</div>
            <div class="t-champ-name" id="t-champ-name"></div>
          </div>
        </div>
        <div class="t-champ-actions">
          <button class="pill-button" id="copy-bracket">Copy link</button>
          <button class="btn-gold" id="new-tournament">New tournament</button>
        </div>
      </div>
      <div class="t-scroll-hint">Scroll to see all rounds →</div>
      <div class="bracket" id="bracket"></div>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script src="tournament.js"></script>
</body>
</html>
