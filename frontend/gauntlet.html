<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscale — Gauntlet</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div id="topbar"></div>
  <main class="page-content gl">
    <section class="gl-card" aria-labelledby="gl-title">
      <h1 class="gl-title" id="gl-title">Gauntlet</h1>
      <p class="gl-sub">How far would a character climb against ever-stronger opponents? It fights them in order and stops at its first loss.</p>
      <span class="gl-lbl" id="gl-char-lbl">Character</span>
      <div class="gl-char-row">
        <div id="gl-char" class="gl-char-slot"></div>
        <select class="gl-select gl-form" id="gl-form" aria-label="Form" hidden></select>
        <button type="button" class="gl-btn" id="gl-random-char">Random</button>
      </div>
      <span class="gl-lbl" id="gl-src-lbl">Where opponents come from</span>
      <div class="gl-sources" role="radiogroup" aria-labelledby="gl-src-lbl">
        <button type="button" class="gl-btn active" data-src="random" role="radio" aria-checked="true">Whole roster</button>
        <button type="button" class="gl-btn" data-src="series" role="radio" aria-checked="false">A series' best known</button>
        <button type="button" class="gl-btn" data-src="custom" role="radio" aria-checked="false">My own picks</button>
      </div>
      <p class="gl-hint" id="gl-src-hint"></p>
      <select class="gl-select gl-series" id="gl-series" aria-label="Series" hidden></select>
      <div id="gl-custom" hidden>
        <div class="gl-picks" id="gl-picks"></div>
        <div id="gl-custom-search"></div>
      </div>
      <div class="gl-run-row">
        <button type="button" class="btn-gold gl-run" id="gl-run">Run the gauntlet</button>
        <span class="form-error" id="gl-error"></span>
      </div>
    </section>

    <section id="gl-result" class="gl-card gl-result" aria-live="polite" hidden></section>
  </main>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script src="gauntlet.js"></script>
</body>
</html>
