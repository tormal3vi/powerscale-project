<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscale — Browse characters</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <div id="topbar"></div>

  <div class="add-character-panel" id="add-character-panel" style="display:none;">
    <form id="add-character-form">
      <input id="add-character-input" type="text" placeholder="Character name or wiki URL — e.g. Genos" autocomplete="off">
      <button type="submit" id="add-character-submit">Fetch</button>
    </form>
    <div class="add-character-status" id="add-character-status"></div>
  </div>

  <div class="page-content">
    <div class="page-head">
      <div>
        <div class="page-title">Browse characters</div>
        <div class="page-subtitle" id="page-subtitle">Search the roster, or filter by series, and add up to two to a comparison.</div>
      </div>
      <div class="page-head-actions">
        <button class="pill-button" id="random-matchup">Random matchup</button>
        <button class="btn-gold" id="daily-matchup">Matchup of the day</button>
      </div>
    </div>

    <label class="search-box" for="search-input">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><circle cx="7" cy="7" r="5" stroke="#7A7264" stroke-width="1.4"/><path d="m11 11 3.5 3.5" stroke="#7A7264" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="visually-hidden">Search characters</span>
      <input id="search-input" type="text" placeholder="Search by name — “Saitama”, “Silver Surfer”…">
    </label>

    <div class="filter-row" id="filter-row"></div>
    <div class="filter-row subfilter-row" id="subfilter-row" hidden></div>

    <div class="toolbar-row">
      <label class="select-box"><span>Sort</span>
        <select id="sort-select">
          <option value="alpha">A–Z</option>
          <option value="strong">Strongest first</option>
          <option value="weak">Weakest first</option>
        </select>
      </label>
      <label class="select-box"><span>Tier</span>
        <select id="tier-select">
          <option value="any">Any tier</option>
          <option value="1">Tier 1</option><option value="2">Tier 2</option>
          <option value="3">Tier 3</option><option value="4">Tier 4</option>
          <option value="5">Tier 5</option><option value="6">Tier 6</option>
          <option value="7">Tier 7</option><option value="8">Tier 8</option>
          <option value="9">Tier 9</option><option value="10">Tier 10</option>
        </select>
      </label>
    </div>

    <div class="grid-note" id="grid-note"></div>
    <div class="character-grid" id="character-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">No characters match that search/filter.</div>
  </div>

  <div class="compare-bar" id="compare-bar" style="display:none;"></div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script src="browse.js"></script>
</body>
</html>
