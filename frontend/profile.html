<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscale — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div id="topbar"></div>
  <div class="auth-wrap">
    <div class="auth-card profile-card" id="profile" style="display:none;">
      <div class="profile-head">
        <div id="profile-avatar"></div>
        <div class="profile-id">
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-sub">Your picture shows next to your posts and replies on the Board.</div>
        </div>
      </div>
      <div class="profile-actions">
        <label class="btn-gold profile-upload">
          <input type="file" id="profile-file" accept="image/jpeg,image/png,image/webp,image/gif" class="visually-hidden">
          <span id="profile-upload-text">Upload photo</span>
        </label>
        <button class="pill-button" id="profile-remove" style="display:none;">Remove photo</button>
      </div>
      <div class="profile-hint">JPG, PNG, WebP or GIF. It's cropped to a square.</div>
      <div class="auth-error" id="profile-error" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><circle cx="8" cy="8" r="6.5" stroke="#E15252" stroke-width="1.3"/><path d="M8 5v3.5M8 10.8v.1" stroke="#E15252" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span id="profile-error-text"></span>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script src="profile.js"></script>
</body>
</html>
