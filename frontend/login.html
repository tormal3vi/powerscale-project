<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powerscale — Log in</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div id="topbar"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Log in</button>
        <button class="auth-tab" data-mode="register">Create account</button>
      </div>
      <div class="auth-error" id="auth-error" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><circle cx="8" cy="8" r="6.5" stroke="#E15252" stroke-width="1.3"/><path d="M8 5v3.5M8 10.8v.1" stroke="#E15252" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span id="auth-error-text"></span>
      </div>
      <form id="auth-form" class="auth-form">
        <label>
          <span class="lbl">Username</span>
          <input id="auth-username" type="text" autocomplete="username" maxlength="20" required>
          <span class="auth-hint">3–20 letters, numbers or underscores</span>
        </label>
        <label>
          <span class="lbl">Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" maxlength="128" required placeholder="••••••••">
          <span class="auth-hint">8+ characters</span>
        </label>
        <button type="submit" class="btn-gold" id="auth-submit">Log in</button>
      </form>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script src="login.js"></script>
</body>
</html>
