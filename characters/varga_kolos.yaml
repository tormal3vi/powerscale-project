name: "Varga Kolos"
category: "Crimson Cross"
origin: "Crimson Cross"
classification: "Human, Archangel-Blade-Fused, King of Hungary"

tier: "5-B | High 1-A"
attack_potency: "Planet level (demonstrated baseline, via atomic-level Division); Outerversal (true, unexercised ceiling)"
speed: "Sub-Relativistic+ (~20% Speed of Light, baseline/typically demonstrated combat speed — not a hard ceiling); much of his defense is automatic/conceptual rather than reaction-dependent"
durability: "Planet level physically | Absolute against any single lethal blow (Sword-granted; does not extend to non-instantaneous death, which requires active use of Division; contingent on active Fusion)"
lifting_strength: "Class 100"
striking_strength: "Planet Class"
stamina: "Superhuman; sustained by the Fusion rather than conventional physiology"
range: "Extended Melee Range; Infinite via the Spatial Division barrier; Planetary via large-scale Atomic Division; Outerversal (true ceiling)"

powers_and_abilities:
  - "Superhuman Physical Characteristics (post-Fusion transformation, 190cm to 215cm)"
  - "Weapon Mastery (the Crimson Blade, fused to his soul rather than carried)"
  - "Fundamental Division (conceptual-level separation, confirmed to extend to concepts themselves, not just matter; scope is Boundless)"
  - "Matter Manipulation (splitting atoms to trigger nuclear-scale explosions)"
  - "Spatial Manipulation (a barrier of constantly dividing space; anything making contact is divided)"
  - "Damage Reduction/Redirection (dividing a single lethal impact into many survivable ones, e.g. surviving falls)"
  - "Absolute Regeneration/Death Negation (the Sword prevents any form of death; does not require the ability to be actively invoked; requires Fusion to be active)"
  - "Resistance to Poison, Disease, and Asphyxiation (via active, conscious application of Division at the molecular/mechanistic level — NOT automatic)"
  - "Non-Physical Interaction (implied by conceptual Division)"

weaknesses: "The Sword's death-negation is passive and absolute, but all other lethal mechanisms (poison, suffocation, disease) require Kolos to be conscious and aware enough to actively divide the threat; he has no automatic defense against these if incapacitated or unaware. His most extreme physical stats and the Sword's death-negation are contingent on active Fusion — severed (see 'The Severing' form), his own stats fall sharply and he loses the Sword's absolute protection entirely, becoming genuinely killable. Psychologically prone to allowing himself unnecessary physical harm as self-punishment, which the Sword visibly disapproves of. Vulnerable to psychic/mental intrusion, as demonstrated against him. Tiering note: the Outerversal ceiling is not a power-up — his true nature was always ontologically independent of the fictional frame he operated within, present but unexercised at every stage; the Planet-level baseline reflects demonstrated restraint, not an actual limit."

forms:
  - name: "Fused, Restrained (standard combat state)"
    tier: "5-B | High 1-A"
    attack_potency: "Planet level (demonstrated); Outerversal (true ceiling, unexercised)"
    speed: "Sub-Relativistic+ (~20% Speed of Light, baseline — not a hard ceiling)"
    durability: "Planet level physically | Absolute vs. lethal blows (contingent on active Fusion)"
    lifting_strength: "Class 100"
    striking_strength: "Planet Class"
    stamina: "Superhuman; sustained by the Fusion"
    range: "Extended Melee Range; Infinite via Spatial Division; Planetary via Atomic Division; Outerversal (true ceiling)"
  - name: "The Severing (Blade torn from chest, wielded/released externally)"
    tier: "7-B (physically) | Low 2-C via the Blade's unleashed attack"
    attack_potency: "City level (physical, severed baseline); Universe level (via a direct strike with the unfused Blade — the attack's power comes from the Blade, not from Kolos's body)"
    speed: "Massively Hypersonic+"
    durability: "City level (severed; loses the Sword's absolute protection entirely — this is the one state in which Kolos can actually die)"
    lifting_strength: "Class 25"
    striking_strength: "City Class physically | Universe level via a direct strike with the unfused Blade"
    stamina: "Superhuman (reduced; no longer sustained by the Fusion)"
    range: "Extended Melee Range physically; Universal via a direct strike with the unfused Blade"
