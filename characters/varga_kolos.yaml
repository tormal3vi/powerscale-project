name: "Varga Kolos"
category: "Crimson Cross"
origin: "Crimson Cross"
classification: "Human, Archangel-Blade-Fused, King of Hungary"

tier: "High 1-A"
attack_potency: "Outerversal (via Fundamental Division; scope is not bound to physical output, and this capability is present at all times, not a power-up state — see Striking Strength for his separate physical baseline)"
speed: "Sub-Relativistic+ (~20% Speed of Light, baseline/typically demonstrated combat speed — not a hard ceiling); much of his defense is automatic/conceptual rather than reaction-dependent"
durability: "Planet level physically | Absolute against any single lethal blow (Sword-granted; does not extend to non-instantaneous death, which requires active use of Division; contingent on active Fusion)"
lifting_strength: "Class 100"
striking_strength: "Planet Class (raw physical baseline via his post-Fusion body; distinct from the Outerversal Attack Potency accessible through Division itself)"
stamina: "Superhuman; sustained by the Fusion rather than conventional physiology"
range: "Extended Melee Range physically; Outerversal via Fundamental Division"

powers_and_abilities:
  - "Superhuman Physical Characteristics (post-Fusion transformation, 190cm to 215cm)"
  - "Weapon Mastery (the Crimson Blade, fused to his soul rather than carried)"
  - "Fundamental Division (conceptual-level separation, extends to concepts themselves, not just matter; Outerversal in scope)"
  - "Matter Manipulation (splitting atoms to trigger nuclear-scale explosions, among far larger-scale applications)"
  - "Spatial Manipulation (a barrier of constantly dividing space; anything making contact is divided)"
  - "Damage Reduction/Redirection (dividing a single lethal impact into many survivable ones, e.g. surviving falls)"
  - "Absolute Regeneration/Death Negation (the Sword prevents any form of death; does not require the ability to be actively invoked; requires Fusion to be active)"
  - "Resistance to Poison, Disease, and Asphyxiation (via active, conscious application of Division at the molecular/mechanistic level — NOT automatic)"
  - "Non-Physical Interaction (implied by conceptual Division)"

weaknesses: "The Sword's death-negation is passive and absolute, but all other lethal mechanisms (poison, suffocation, disease) require Kolos to be conscious and aware enough to actively divide the threat; he has no automatic defense against these if incapacitated or unaware. His physical stats (durability, striking strength, speed, lifting strength) and the Sword's death-negation are contingent on active Fusion — severed (see 'The Severing' form), his own body's stats fall sharply and he loses the Sword's absolute protection entirely, becoming genuinely killable. Notably, his Attack Potency via Division is unaffected by severance, since it originates from the Blade itself rather than from Kolos's body. Psychologically prone to allowing himself unnecessary physical harm as self-punishment, which the Sword visibly disapproves of. Vulnerable to psychic/mental intrusion, as demonstrated against him. His true capability is concealed by choice and narrative restraint, not by any actual limitation."

forms:
  - name: "Fused, Restrained (standard combat state)"
    tier: "High 1-A"
    attack_potency: "Outerversal (via Fundamental Division)"
    speed: "Sub-Relativistic+ (~20% Speed of Light, baseline — not a hard ceiling)"
    durability: "Planet level physically | Absolute vs. lethal blows (contingent on active Fusion)"
    lifting_strength: "Class 100"
    striking_strength: "Planet Class (physical baseline)"
    stamina: "Superhuman; sustained by the Fusion"
    range: "Extended Melee Range physically; Outerversal via Fundamental Division"
  - name: "The Severing (Blade torn from chest, wielded/released externally)"
    tier: "7-B (physically) | High 1-A (via the Blade, unchanged)"
    attack_potency: "City level (physical, severed baseline); Outerversal (unchanged — Division's power comes from the Blade itself, not from Kolos's body, and is unaffected by severance)"
    speed: "Massively Hypersonic+"
    durability: "City level (severed; loses the Sword's absolute protection entirely — this is the one state in which Kolos can actually die)"
    lifting_strength: "Class 25"
    striking_strength: "City Class physically | Outerversal via a direct strike with the unfused Blade"
    stamina: "Superhuman (reduced; no longer sustained by the Fusion)"
    range: "Extended Melee Range physically; Outerversal via a direct strike with the unfused Blade"
