services:
  - type: web
    name: powerscale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Accounts, posts and admin overrules (Neon Postgres connection
      # string). Set in the Render dashboard - never committed.
      - key: DATABASE_URL
        sync: false
      # Comma-separated usernames allowed to overrule matchups and delete
      # any post, e.g. "levente,friend2".
      - key: ADMIN_USERNAMES
        sync: false
      # Discord (optional; see backend/discord_webhooks.py and
      # backend/discord_bot.py). Channel webhooks for announcements:
      - key: DISCORD_WEBHOOK_OVERRULES
        sync: false
      - key: DISCORD_WEBHOOK_DUELS
        sync: false
      - key: DISCORD_WEBHOOK_LEADERBOARD
        sync: false
      - key: DISCORD_WEBHOOK_UPDATES
        sync: false
      - key: DISCORD_WEBHOOK_DAILY
        sync: false
      - key: DISCORD_WEBHOOK_LOBBY
        sync: false
      # The server's invite link for the "Join our Discord" button,
      # e.g. https://discord.gg/abc123
      - key: DISCORD_INVITE_URL
        sync: false
      # The Discord app's slash commands (discord.com/developers):
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      # Linked Roles (OAuth2 -> Client Secret): roles that unlock from Powerscale stats.
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # /admin (backend/discord_admin.py): Claude plans channel and role
      # changes from a description. console.anthropic.com -> API keys.
      - key: ANTHROPIC_API_KEY
        sync: false
